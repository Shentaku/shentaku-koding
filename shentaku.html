<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shentaku — Arsip Karakter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #15181d;
    --ink-2: #1c2026;
    --panel: #20242b;
    --line: #333944;
    --gold: #c9a15a;
    --gold-dim: #a7854a;
    --jade: #5c8571;
    --parchment: #ece6d8;
    --parchment-dim: #a8a294;
    --danger: #b0564a;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #f6f3ea;
      --ink-2: #efeadd;
      --panel: #fffdf7;
      --line: #ddd5c0;
      --gold: #a7793a;
      --gold-dim: #8a6530;
      --jade: #3f6350;
      --parchment: #23241f;
      --parchment-dim: #6b6656;
    }
  }
  :root[data-theme="light"] {
    --ink: #f6f3ea;
    --ink-2: #efeadd;
    --panel: #fffdf7;
    --line: #ddd5c0;
    --gold: #a7793a;
    --gold-dim: #8a6530;
    --jade: #3f6350;
    --parchment: #23241f;
    --parchment-dim: #6b6656;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--parchment);
    font-family: 'Work Sans', system-ui, sans-serif;
    min-height: 100vh;
  }

  .frame {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: 0.01em;
    color: var(--gold);
  }
  .brand p {
    margin: 0;
    color: var(--parchment-dim);
    font-size: 0.92rem;
    max-width: 46ch;
    line-height: 1.5;
  }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  .index-col h2, .detail-col h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--jade);
    margin: 0 0 14px;
  }

  .char-list { list-style: none; margin: 0; padding: 0; }
  .char-list li { border-bottom: 1px solid var(--line); }
  .char-list button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--parchment);
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    padding: 13px 4px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .char-list button .role {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.76rem;
    color: var(--parchment-dim);
    white-space: nowrap;
  }
  .char-list button:hover { color: var(--gold); }
  .char-list li.selected button { color: var(--gold); }

  .empty-index {
    color: var(--parchment-dim);
    font-size: 0.88rem;
    line-height: 1.6;
    padding: 8px 4px;
  }

  .detail-col { min-height: 300px; }

  .placeholder {
    color: var(--parchment-dim);
    font-size: 0.95rem;
    line-height: 1.7;
    padding-top: 20px;
    max-width: 50ch;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px 36px;
  }
  .card h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.9rem;
    margin: 0 0 2px;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-size: 0.85rem;
    color: var(--parchment-dim);
    margin-bottom: 22px;
  }
  .meta-row span b { color: var(--parchment); font-weight: 500; }
  .section-block {
    border-top: 1px solid var(--line);
    padding-top: 18px;
    margin-top: 18px;
  }
  .section-block h4 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    color: var(--jade);
    margin: 0 0 12px;
  }
  .card .desc {
    line-height: 1.75;
    font-size: 0.98rem;
    white-space: pre-wrap;
    color: var(--parchment);
  }
  .stat-row {
    display: grid;
    grid-template-columns: 120px 1fr 42px;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .stat-row .stat-label { font-size: 0.86rem; color: var(--parchment-dim); }
  .stat-bar-track { height: 6px; background: var(--ink-2); border-radius: 3px; overflow: hidden; }
  .stat-bar-fill { height: 100%; background: var(--gold-dim); }
  .stat-row .stat-val { font-size: 0.82rem; color: var(--parchment-dim); text-align: right; }
  .trait-item { margin-bottom: 14px; }
  .trait-item .trait-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .trait-item .trait-name { font-weight: 500; color: var(--parchment); font-size: 0.95rem; }
  .trait-tag {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
  }
  .trait-tag.kekuatan { color: var(--jade); border-color: var(--jade); }
  .trait-tag.kelemahan { color: var(--danger); border-color: var(--danger); }
  .trait-item .trait-desc { font-size: 0.88rem; color: var(--parchment-dim); line-height: 1.6; }

  footer.foot {
    margin-top: 60px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--parchment-dim);
    font-size: 0.78rem;
  }
</style>
</head>
<body>
<div class="frame">
  <header class="top">
    <div class="brand">
      <h1>Shentaku</h1>
      <p>Arsip karakter — kumpulan catatan untuk dunia dan tokoh yang sedang ditulis.</p>
    </div>
  </header>

  <div class="layout">
    <div class="index-col">
      <h2>Daftar Karakter</h2>
      <ul class="char-list" id="charList"></ul>
    </div>
    <div class="detail-col" id="detailCol">
      <div class="placeholder">Pilih karakter dari daftar di sebelah kiri untuk melihat catatannya.</div>
    </div>
  </div>

  <footer class="foot">Arsip statis — diperbarui langsung lewat kode oleh penulis.</footer>
</div>

<script>
// ======================================================
// DATA KARAKTER — edit / tambah karakter di sini langsung.
// Salin blok { ... } untuk menambah karakter baru.
// ======================================================
const CHARACTERS = [
  // {
  //   gelar: 'Isagi Yoichi, sang Egoist',
  //   usia: '17', jenisKelamin: 'Laki-laki',
  //   peran: 'Protagonis', ras: 'Manusia',
  //   asal: 'Jepang', faksi: 'Blue Lock', relasi: 'Rival: Bachira Meguru',
  //   deskripsiFisik: 'Perawakan atletis, rambut hitam.',
  //   sifat: 'Analitis, egois di lapangan, tapi mudah belajar dari kekalahan.',
  //   stats: [ { label: 'Kekuatan', value: 70 }, { label: 'Kecepatan', value: 85 } ],
  //   traits: [
  //     { label: 'Direct Shoot', type: 'kekuatan', description: 'Insting mencetak gol yang terus berkembang.' },
  //     { label: 'Terlalu individualis', type: 'kelemahan', description: 'Sulit percaya rekan setim di awal cerita.' }
  //   ],
  //   motivasi: 'Menjadi penyerang terbaik di dunia.',
  //   arc: 'Dari pemain biasa jadi egois yang menang.',
  //   quote: 'Aku akan memakan semuanya.',
  //   backstory: 'Dulu pernah kehilangan kesempatan mencetak gol penentu di masa SMP.'
  // },
];

let characters = {};
let selectedId = null;

const charListEl = document.getElementById('charList');
const detailColEl = document.getElementById('detailCol');

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderList() {
  const ids = Object.keys(characters).sort((a,b) => (characters[a].gelar||'').localeCompare(characters[b].gelar||''));
  if (ids.length === 0) {
    charListEl.innerHTML = '<div class="empty-index">Belum ada karakter di arsip.</div>';
    return;
  }
  charListEl.innerHTML = ids.map(id => {
    const c = characters[id];
    const sel = id === selectedId ? 'selected' : '';
    return `<li class="${sel}"><button data-id="${id}"><span>${escapeHtml(c.gelar || '(tanpa nama)')}</span><span class="role">${escapeHtml(c.peran || '')}</span></button></li>`;
  }).join('');
  charListEl.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedId = btn.getAttribute('data-id');
      renderList();
      renderDetail();
    });
  });
}

function renderDetail() {
  if (!selectedId || !characters[selectedId]) {
    detailColEl.innerHTML = '<div class="placeholder">Pilih karakter dari daftar di sebelah kiri untuk melihat catatannya.</div>';
    return;
  }
  const c = characters[selectedId];
  const stats = c.stats || [];
  const traits = c.traits || [];
  const metaParts = [];
  if (c.usia) metaParts.push(`<span><b>Usia</b> ${escapeHtml(c.usia)}</span>`);
  if (c.jenisKelamin) metaParts.push(`<span><b>Jenis kelamin</b> ${escapeHtml(c.jenisKelamin)}</span>`);
  if (c.peran) metaParts.push(`<span><b>Peran</b> ${escapeHtml(c.peran)}</span>`);
  if (c.ras) metaParts.push(`<span><b>Ras/spesies</b> ${escapeHtml(c.ras)}</span>`);
  if (c.asal) metaParts.push(`<span><b>Asal</b> ${escapeHtml(c.asal)}</span>`);
  if (c.faksi) metaParts.push(`<span><b>Faksi</b> ${escapeHtml(c.faksi)}</span>`);
  if (c.relasi) metaParts.push(`<span><b>Relasi</b> ${escapeHtml(c.relasi)}</span>`);

  const statsHtml = stats.length ? stats.map(s => {
    const val = Math.max(0, Math.min(100, Number(s.value) || 0));
    return `<div class="stat-row"><div class="stat-label">${escapeHtml(s.label)}</div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${val}%"></div></div><div class="stat-val">${escapeHtml(String(s.value))}</div></div>`;
  }).join('') : '';

  const traitsHtml = traits.length ? traits.map(t => `
    <div class="trait-item">
      <div class="trait-head"><span class="trait-name">${escapeHtml(t.label)}</span><span class="trait-tag ${t.type === 'kelemahan' ? 'kelemahan' : 'kekuatan'}">${t.type === 'kelemahan' ? 'Kelemahan' : 'Kekuatan'}</span></div>
      <div class="trait-desc">${escapeHtml(t.description || '')}</div>
    </div>`).join('') : '';

  detailColEl.innerHTML = `
    <div class="card">
      <h3>${escapeHtml(c.gelar || '(tanpa nama)')}</h3>
      ${metaParts.length ? `<div class="meta-row">${metaParts.join('')}</div>` : ''}

      ${(c.deskripsiFisik || c.sifat) ? `<div class="section-block">
        <h4>Fisik & Kepribadian</h4>
        ${c.deskripsiFisik ? `<div class="desc">${escapeHtml(c.deskripsiFisik)}</div>` : ''}
        ${c.sifat ? `<div class="desc" style="margin-top:8px;">${escapeHtml(c.sifat)}</div>` : ''}
      </div>` : ''}

      ${statsHtml ? `<div class="section-block"><h4>Stats</h4>${statsHtml}</div>` : ''}
      ${traitsHtml ? `<div class="section-block"><h4>Trait</h4>${traitsHtml}</div>` : ''}

      ${(c.motivasi || c.arc || c.quote) ? `<div class="section-block">
        <h4>Naratif</h4>
        ${c.motivasi ? `<div class="desc"><b style="color:var(--parchment-dim);font-weight:500;">Motivasi:</b> ${escapeHtml(c.motivasi)}</div>` : ''}
        ${c.arc ? `<div class="desc" style="margin-top:6px;"><b style="color:var(--parchment-dim);font-weight:500;">Arc:</b> ${escapeHtml(c.arc)}</div>` : ''}
        ${c.quote ? `<div class="desc" style="margin-top:6px;font-style:italic;">"${escapeHtml(c.quote)}"</div>` : ''}
      </div>` : ''}

      ${c.backstory ? `<div class="section-block"><h4>Backstory</h4><div class="desc">${escapeHtml(c.backstory)}</div></div>` : ''}
    </div>
  `;
}

function init() {
  characters = {};
  CHARACTERS.forEach((c, i) => { characters['char_' + i] = c; });
  renderList();
  renderDetail();
}

init();
</script>
</body>
</html>
